<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>胡志明 3天2夜行程</title>

<meta name="theme-color" content="#dceeff">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{--bg:#f7f7fb;--card:#fff;--text:#222;--muted:#777;--line:#e8e8ef;--accent:#4f86c6;--day:#fff5cf;--locked:#ffe6e6}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1240px;margin:0 auto;padding:22px}
.hero{background:linear-gradient(135deg,#dceeff,#eef6ff);padding:22px 24px;border-radius:20px;margin-bottom:18px}
h1{margin:0 0 8px;font-size:28px} .sub{color:var(--muted);font-size:14px;line-height:1.7}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}
.day-select{max-width:100%;min-width:0;padding:8px;font:inherit;border:1px solid #cbd5df;border-radius:6px;background:#fff;color:inherit}
.toolbar .day-select{max-width:210px;font-size:14px}
button{border:0;border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
button.primary{background:var(--accent);color:white}
.status{font-size:13px;color:var(--muted);align-self:center}
.help{margin:0 0 15px;padding:12px 14px;border-radius:12px;background:#fff8dc;font-size:13px;line-height:1.7}
.table-wrap{overflow:auto;background:var(--card);border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse;min-width:1080px}
th,td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
th{position:sticky;top:0;background:#5b9bd5;color:#fff;text-align:left;z-index:2}
td:nth-child(1){width:145px;font-weight:700}
td:nth-child(2){width:125px;white-space:nowrap}
td:nth-child(3){width:300px}

.day-row td{background:var(--day);font-weight:700}
.locked-time{background:var(--locked)!important}
.it-link{color:#1565c0;text-decoration:none;font-weight:700}
.it-link:hover{text-decoration:underline}
.url-link{font-size:12px;color:#1769aa;word-break:break-all}
.mapbtn{display:inline-block;background:#eef5ff;color:#1769aa;text-decoration:none;font-weight:700;padding:7px 10px;border-radius:10px;margin-bottom:5px}
.mapbtn:hover{background:#dcecff}
.drag{cursor:grab;font-size:22px;color:#999;text-align:center;width:46px;user-select:none}
tr.dragging{opacity:.45}
tr.drop-target{outline:2px dashed #5b9bd5;outline-offset:-2px}
.edit-input{width:100%;min-width:220px;padding:8px 9px;border:1px solid #d7d7df;border-radius:9px;font-size:12px}
td[contenteditable="true"]{background:#fffdf1;outline:2px solid transparent}
td[contenteditable="true"]:focus{outline-color:#ffd96b}
.small{font-size:11px;color:#888}
@media(max-width:700px){.wrap{padding:12px}h1{font-size:22px}}

/* Day-based color system */
tr.day1 td { background:#eef6ff; }
tr.day2 td { background:#fff0f6; }
tr.day3 td { background:#eefaf3; }
tr.lodging td { background:#f4f1ff; }
tr.day-header.day1 td { background:#cfe7ff !important; }
tr.day-header.day2 td { background:#ffd9ea !important; }
tr.day-header.day3 td { background:#d9f3e4 !important; }
tr.lodging td { background:#e7defc !important; }

.weather-note{
  display:inline-flex; align-items:center; gap:6px;
  margin-top:5px; padding:4px 8px; border-radius:999px;
  font-size:12px; font-weight:800; background:#fff3cd; color:#7a5200;
}
.booking-chip{
  display:inline-block; margin-left:6px; padding:2px 7px;
  border-radius:999px; font-size:11px; font-weight:800;
  background:#ffe0e0; color:#a32121;
}
.time-fixed{
  display:inline-block; margin-left:5px; padding:2px 6px;
  border-radius:999px; font-size:10px; font-weight:700;
  background:#ffe6e6; color:#a33;
}
.it-link{
  display:inline-block; color:#1558b0; text-decoration:none; font-weight:800;
}
.it-link::after{
  content:" ↗";
  font-size:12px; color:#6a7a90;
}
.it-link:hover{ text-decoration:underline; }
tr.dragging{ opacity:.4; transform:scale(.995); }
tr.drop-target{ outline:3px dashed #5b9bd5; outline-offset:-3px; }
tr:hover td{ filter:brightness(.992); }
.day-label{
  font-weight:900; letter-spacing:.2px;
}
.mobile-hint{
  display:none; margin:8px 0 0; font-size:12px; color:#667;
}
@media(max-width:760px){
  .table-wrap{overflow:visible;background:transparent;box-shadow:none}
  table{min-width:0}
  thead{display:none}
  tbody,tr,td{display:block;width:100%}
  tr{
    margin:0 0 12px; border-radius:16px; overflow:hidden;
    box-shadow:0 3px 14px rgba(0,0,0,.07);
  }
  td{
    border-bottom:1px solid rgba(0,0,0,.05);
    padding:10px 12px;
  }
  td:first-child{position:absolute; right:14px; width:auto; background:transparent!important; border:0; z-index:2}
  td:nth-child(2)::before{content:"日期｜";font-weight:700;color:#777}
  td:nth-child(3)::before{content:"時間｜";font-weight:700;color:#777}
  td:nth-child(4)::before{content:"行程｜";font-weight:700;color:#777}
  td:nth-child(5)::before{content:"備註｜";font-weight:700;color:#777}
  td:nth-child(6){display:none}
  td:nth-child(7){display:none}
  .mobile-hint{display:block}
}


.transport-chip{
  display:inline-block;
  margin-top:6px;
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  background:#eef1f5;
  color:#4a5560;
}


/* Stronger reservation + timing guidance */
.booking-chip{
  display:inline-flex !important;
  align-items:center;
  gap:4px;
  margin-left:8px;
  padding:4px 9px !important;
  border-radius:999px;
  font-size:11px !important;
  font-weight:900 !important;
  background:#d93025 !important;
  color:#fff !important;
  box-shadow:0 2px 6px rgba(217,48,37,.22);
}
.depart-chip,
.leave-chip{
  display:inline-block;
  margin-top:6px;
  margin-right:6px;
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}
.depart-chip{
  background:#e8f3ff;
  color:#165a9c;
}
.leave-chip{
  background:#fff0d9;
  color:#8a5400;
}
.short-address{
  color:#606770;
  font-size:13px;
}
.drag-denied{
  animation:shake .25s linear 2;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-4px)}
  75%{transform:translateX(4px)}
}


/* ===== Mobile-first itinerary layout ===== */
.table-wrap{
  overflow:visible !important;
  background:transparent !important;
  box-shadow:none !important;
}
table{
  width:100% !important;
  min-width:0 !important;
  border-collapse:separate !important;
  border-spacing:0 10px !important;
}
thead{display:none !important;}
tbody{display:block;}
tr{
  display:grid;
  grid-template-columns: 118px minmax(0,1.45fr) minmax(0,1fr);
  gap:0;
  margin:0 0 10px;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}
tr td{
  display:block;
  width:auto !important;
  min-width:0;
  padding:12px 12px !important;
  border-bottom:0 !important;
  line-height:1.45;
  background:inherit;
}
tr td.drag{
  display:none !important;
}
tr td:nth-child(2){ /* date cell hidden for normal rows */
  display:none;
}
tr td:nth-child(3){ /* time */
  grid-column:1;
  white-space:nowrap !important;
  font-weight:800;
  font-size:14px;
}
tr td:nth-child(4){ /* itinerary */
  grid-column:2;
  font-size:15px;
  font-weight:800;
  overflow-wrap:anywhere;
}
tr td:nth-child(5){ /* notes */
  grid-column:3;
  font-size:13px;
  color:#5f6670;
  overflow-wrap:anywhere;
}
tr td:nth-child(6), tr td:nth-child(7){
  display:none !important;
}
tr.day-header{
  display:block !important;
  margin-top:18px;
  margin-bottom:8px;
  box-shadow:none;
  border-radius:18px;
}
tr.day-header td{
  display:none !important;
}
tr.day-header td:nth-child(2){
  display:block !important;
  width:100% !important;
  padding:15px 16px !important;
  font-size:18px;
  font-weight:900;
  letter-spacing:.2px;
}
tr.day-header.day1 td:nth-child(2){background:#cfe7ff !important;}
tr.day-header.day2 td:nth-child(2){background:#ffd9ea !important;}
tr.day-header.day3 td:nth-child(2){background:#d9f3e4 !important;}
tr.lodging{
  display:block !important;
  box-shadow:none;
  margin-bottom:14px;
}
tr.lodging td{
  display:none !important;
}
tr.lodging td:nth-child(4),
tr.lodging td:nth-child(5){
  display:block !important;
  background:#e7defc !important;
}
tr.lodging td:nth-child(4){
  border-radius:16px 16px 0 0;
  font-size:16px;
}
tr.lodging td:nth-child(5){
  border-radius:0 0 16px 16px;
}
.booking-chip{
  vertical-align:middle;
}
.transport-note{
  display:block;
  margin-top:6px;
  font-size:12px;
  font-weight:700;
  color:#4f5965;
}
@media(max-width:720px){
  .wrap{padding:10px !important;}
  .hero{padding:16px !important;border-radius:16px !important;}
  h1{font-size:21px !important;}
  tr{
    grid-template-columns: 102px minmax(0,1fr);
  }
  tr td:nth-child(3){grid-column:1;}
  tr td:nth-child(4){grid-column:2;}
  tr td:nth-child(5){
    grid-column:1 / -1;
    padding-top:0 !important;
    font-size:12.5px;
  }
  tr td:nth-child(3){
    font-size:13px;
    padding-right:8px !important;
  }
  tr td:nth-child(4){
    font-size:14.5px;
  }
  .toolbar{
    gap:8px !important;
  }
  .toolbar button{
    padding:9px 11px !important;
    font-size:13px !important;
  }
}


.reserved-time-badge{
  display:inline-block;
  margin-left:8px;
  padding:4px 9px;
  border-radius:999px;
  background:#d93025;
  color:#fff;
  font-size:13px;
  font-weight:900;
  line-height:1.2;
  vertical-align:middle;
  box-shadow:0 2px 6px rgba(217,48,37,.22);
}
@media(max-width:720px){
  .reserved-time-badge{
    display:block;
    width:max-content;
    margin-left:0;
    margin-top:5px;
    font-size:13px;
    padding:4px 8px;
  }
}


.day-header td::after{
  display:block;
  margin-top:5px;
  font-size:12px;
  font-weight:800;
  opacity:.82;
}
.day-header.day1 td::after{content:"🛬 抵達日｜固定預約為主";}
.day-header.day2 td::after{content:"⛈️ 戶外拍照優先排上午";}
.day-header.day3 td::after{content:"✈️ 回程日｜預留塞車＋提早到機場";}


.delete-row-btn{
  border:0;
  width:34px;
  height:34px;
  border-radius:50%;
  padding:0;
  background:#ffe8e8;
  color:#b42318;
  font-size:20px;
  font-weight:900;
  line-height:34px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}
@media(max-width:720px){
  tr td:nth-child(7){
    display:flex !important;
    grid-column:1 / -1;
    justify-content:flex-end;
    align-items:center;
    padding:0 10px 8px !important;
    background:inherit !important;
  }
  tr.day-header td:nth-child(7),
  tr.lodging td:nth-child(7){
    display:none !important;
  }
}


.flight-row{
  background:#eaf4ff !important;
  border-left:5px solid #6aa8e8;
}
.flight-row td{
  background:#eaf4ff !important;
}
.flight-row td:nth-child(4){
  font-weight:900;
  color:#174f85;
}


/* Fix full-width date header */
tr.day-header{
  display:block !important;
  width:100% !important;
  margin:18px 0 8px !important;
  box-shadow:none !important;
  border-radius:18px !important;
}
tr.day-header td{
  display:block !important;
  width:100% !important;
  padding:15px 16px !important;
  font-size:18px !important;
  font-weight:900 !important;
  letter-spacing:.2px;
  border-radius:18px !important;
}
tr.day-header.day1 td{background:#cfe7ff !important;}
tr.day-header.day2 td{background:#ffd9ea !important;}
tr.day-header.day3 td{background:#d9f3e4 !important;}


.transport-badge{
  display:inline-flex;
  align-items:center;
  width:max-content;
  margin-top:6px;
  padding:4px 8px;
  border-radius:8px;
  background:#edf2f7;
  border:1px solid #d7dee8;
  color:#44505c;
  font-size:12px;
  font-weight:800;
  line-height:1.2;
}


/* Pure DAY data rows are used only to generate full-width date bars */
tr.day-data-anchor{display:none !important;}


tr td:nth-child(3):empty{
  opacity:.55;
}

/* Keep edit controls accessible at every viewport size. */
tr{position:relative}
tr.day-header td:first-child{position:static}
tr td:nth-child(3){white-space:normal !important;overflow-wrap:anywhere}
.edit-input{min-width:0;font-size:16px}
td[contenteditable="true"]{font-size:16px !important}
body.is-editing tr:not(.day-data-anchor):not(.lodging):not(.day-header) td.drag{
  display:block !important;position:static;grid-column:1 / -1;
  padding:4px 12px !important;min-height:44px;text-align:left;touch-action:none;
}
body.is-editing tr:not(.day-data-anchor):not(.day-header) td:nth-child(6){
  display:block !important;grid-column:1 / -1;
}
body.is-editing tr:not(.day-data-anchor):not(.lodging):not(.day-header) td:nth-child(7){
  display:flex !important;position:absolute;top:4px;right:8px;padding:0 !important;z-index:3;
}
body:not(.is-editing) tr td:nth-child(7){display:none !important}
.delete-row-btn{width:40px;height:40px;line-height:40px}
.drag::before, .day-header td::before, .lodging td::before{content:none !important}

/* Use the same cells as stacked sections on narrow phones. */
@media(max-width:640px){
  .wrap{padding:12px !important;}
  .table-wrap, table, tbody{width:100%;min-width:0;max-width:100%;}
  table{display:block;}
  tr:not(.day-header):not(.lodging):not(.day-data-anchor){
    display:flex;flex-direction:column;align-items:stretch;gap:10px;
    width:100%;min-width:0;padding:18px 16px;margin-bottom:14px;
  }
  tr.day1{background:#eef6ff !important;}
  tr.day2{background:#fff0f6 !important;}
  tr.day3{background:#eefaf3 !important;}
  tr.flight-row{background:#eaf4ff !important;}
  tr:not(.day-header):not(.lodging) td{
    width:100% !important;min-width:0;max-width:100%;padding:0 !important;
    word-break:normal;overflow-wrap:break-word;white-space:normal !important;
  }
  tr:not(.day-header):not(.lodging) td:nth-child(3){
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px;
  }
  tr:not(.day-header):not(.lodging) td:nth-child(4),
  body.is-editing tr:not(.day-header):not(.lodging) td:nth-child(4){
    font-size:18px !important;font-weight:700;line-height:1.45;
  }
  tr:not(.day-header):not(.lodging) td:nth-child(4)::before,
  tr:not(.day-header):not(.lodging) td:nth-child(5)::before{
    display:block;margin-bottom:4px;font-size:15px;font-weight:700;line-height:1.45;
  }
  tr:not(.day-header):not(.lodging) td:nth-child(5){font-size:15px;line-height:1.55;}
  .it-link{display:block;width:100%;min-width:0;font-weight:700;line-height:1.45;word-break:normal;overflow-wrap:break-word;}
  .reserved-time-badge{flex:0 0 auto;width:auto;max-width:100%;margin:0;}
  .transport-badge{display:inline-block;width:fit-content;max-width:100%;white-space:normal;overflow-wrap:break-word;line-height:1.45;}
  .flight-details,.reservation-address{display:block;}
  .mobile-line-separator{display:none;}
  tr.day-header{margin:12px 0 8px !important;}
  body.is-editing tr:not(.day-data-anchor):not(.lodging):not(.day-header) td.drag{
    padding:0 44px 0 0 !important;min-height:40px;
  }
  body.is-editing tr:not(.day-data-anchor):not(.lodging):not(.day-header) td:nth-child(7){
    width:40px !important;max-width:40px;
  }
  .edit-input{max-width:100%;min-width:0;}
  .toolbar>*{min-width:0;max-width:100%;overflow-wrap:break-word;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🇻🇳 胡志明 3天2夜行程</h1>
    
  </div>

  <div class="toolbar">
    <button id="editBtn" class="primary">✏️ 開始編輯</button>
    <button id="recalcBtn">🕒 重新計算時間</button>
    <select id="addDay" class="day-select" aria-label="新增行程日期"></select>
    <button id="addBtn">➕ 新增一列</button>
    <span id="status" class="status" role="status" aria-live="polite">目前為瀏覽模式</span>
  </div>

  <div class="table-wrap">
  <table>
    <thead><tr><th>拖拉</th><th>日期</th><th>時間</th><th>行程</th><th>備註</th><th>設定</th><th>操作</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  </div>
</div>

<dialog id="conflictDialog" aria-labelledby="conflictTitle" style="max-width:480px;width:calc(100% - 28px);box-sizing:border-box;border:1px solid #ddd;border-radius:8px;padding:20px;">
  <h2 id="conflictTitle" style="font-size:20px;margin-top:0;">雲端已有其他修改</h2>
  <p style="font-size:15px;line-height:1.55;">本機與雲端內容不同。載入雲端會先備份本機草稿；覆蓋雲端會以目前整份行程取代其他人的修改。</p>
  <div style="display:flex;flex-wrap:wrap;gap:10px;">
    <button id="useCloudBtn">載入雲端新版</button>
    <button id="useDraftBtn">以本機版本覆蓋雲端</button>
    <button id="cancelSyncBtn">繼續編輯</button>
  </div>

<script>

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function save() {
  const serialized=JSON.stringify(rows);
  const changed=serialized!==savedRowsJSON;
  try { localStorage.setItem(KEY, serialized); }
  catch(error){ statusEl.textContent = "無法儲存本機草稿｜請勿關閉頁面"; return; }
  if(changed) syncMeta.dirty=true;
  savedRowsJSON=serialized; persistSync();
  statusEl.textContent = syncMeta.dirty ? "本機草稿已儲存｜尚未同步" : "內容未變更";
  if(changed) window.dispatchEvent(new Event('tripdraftchange'));
}
function parseStart(t) {
  const m = String(t||"").match(/(\d{1,2}):(\d{2})/);
  return m ? (+m[1]*60 + +m[2]) : null;
}
function fmt(min) {
  min = ((min % 1440) + 1440) % 1440;
  const h = Math.floor(min/60), m = min%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}

function validateChronologicalOrder(){
  const issues = [];
  let currentDay = "";
  let last = -1;
  for(let i=0;i<rows.length;i++){
    const d = String(rows[i][0]||"");
    if(d.includes("DAY")){
      currentDay = d;
      last = -1;
      continue;
    }
    if(currentDay==="") continue;
    const st = parseStart(rows[i][1]);
    if(st===null) continue;
    if(st < last){
      issues.push(i);
    } else {
      last = st;
    }
  }
  return issues;
}

function recalcTimes() {
  // Recalculate separately inside each day section; fixed-time rows act as anchors.
  let current = null;
  for (let i=0;i<rows.length;i++) {
    const r = rows[i];
    if (r[0] === "住宿") continue;
    const startsDay = r[0] && String(r[0]).includes("DAY");
    if (startsDay) {
      current = parseStart(r[1]);
      if (r[6] && current !== null) current += (Number(r[5])||0);
      continue;
    }
    if (r[6]) {
      const locked = parseStart(r[1]);
      if (locked !== null) current = locked + (Number(r[5])||0);
      continue;
    }
    if (current === null) continue;
    const dur = Number(r[5]) || 0;
    if(dur === 0 && !r[1]) continue;
    r[1] = dur > 0 ? `${fmt(current)}～${fmt(current+dur)}` : fmt(current);
    current += dur;
  }
  save(); render();
  const issues = validateChronologicalOrder();
  if(issues.length){
    statusEl.textContent = "⚠️ 有行程時間不是依序排列，請調整順序或時間";
  }
}

    if(/^(🚕|🚶)/.test(line.trim())){

function nextFixedIndex(i){
  const day = dayKeyForIndex(i);
  for(let k=i+1;k<rows.length;k++){
    if(dayKeyForIndex(k)!==day) break;
    if(rows[k][6] && parseStart(rows[k][1])!==null) return k;
  }
  return -1;
}
function suggestedDepartForRow(i){
  if(!rows[i][6]) return "";
  const start = parseStart(rows[i][1]);
  if(start===null) return "";
  const day = dayKeyForIndex(i);
  if(i===0 || dayKeyForIndex(i-1)!==day) return "";
  const travel = transportMinutes(rows[i][2]);
  if(!travel) return "";
  // 10-minute safety buffer
  return fmt(start - travel - 10);
}
function latestLeaveForRow(i){
  const j = nextFixedIndex(i);
  if(j<0) return "";
  const start = parseStart(rows[j][1]);
  const travel = transportMinutes(rows[j][2]);
  if(start===null || !travel) return "";
  // 10-minute safety buffer
  const t = start - travel - 10;
  const ownStart = parseStart(rows[i][1]);
  if(ownStart!==null && t <= ownStart) return "";
  return fmt(t);
}

    const dragTd=document.createElement("td");
    dragTd.className="drag";
    dragTd.textContent = anchor ? "•" : editing ? "☰" : "";
    dragTd.title = anchor ? "日期起點不可拖動" : "拖拉調整順序";
    if(!anchor&&editing){
      dragTd.tabIndex = 0;
      dragTd.setAttribute("role", "button");
      dragTd.setAttribute("aria-label", "拖拉調整順序，方向鍵上下移動");
      dragTd.addEventListener("keydown", event => {
        if(event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
        event.preventDefault();
        let target=i+(event.key==='ArrowUp'?-1:1);
        if(event.key==='ArrowUp'&&isDayAnchor(target)) target--;
        moveRow(i,target);
      });
      dragTd.addEventListener("pointerdown", event => {
        if(!editing || event.button !== 0) return;
        event.preventDefault();
        dragTd.setPointerCapture(event.pointerId);
        let target = i;
        tr.classList.add("dragging");
        const onMove = move => {
          const hit = document.elementFromPoint(move.clientX, move.clientY)?.closest("tr[data-index], tr[data-day-index]");
          document.querySelectorAll(".drop-target").forEach(el => el.classList.remove("drop-target"));
          target = hit ? Number(hit.dataset.index??hit.dataset.dayIndex) : i;
          if(!canMoveTo(target)) target = i;
          if(target !== i) hit.classList.add("drop-target");
        };
        const finish = up => {
          dragTd.removeEventListener("pointermove", onMove);
          dragTd.removeEventListener("pointerup", finish);
          dragTd.removeEventListener("pointercancel", finish);
          tr.classList.remove("dragging");
          document.querySelectorAll(".drop-target").forEach(el => el.classList.remove("drop-target"));
          if(up.type === "pointerup") moveRow(i, target);
        };
        dragTd.addEventListener("pointermove", onMove);
        dragTd.addEventListener("pointerup", finish);
        dragTd.addEventListener("pointercancel", finish);
      });
    }
    tr.appendChild(dragTd);

    // Date
    const dateTd = document.createElement("td");
    if(editing){
      dateTd.contentEditable = "true";
      dateTd.innerText = r[0] || "";
      dateTd.addEventListener("input", e=>{rows[i][0]=e.target.innerText; save();});
    } else {
      const dateText = document.createElement("div");
      dateText.className = "day-label";
      dateText.textContent = (r[0] && String(r[0]).includes("DAY")) ? "" : (r[0] || "");
      dateTd.appendChild(dateText);
    }
    tr.appendChild(dateTd);

    // Time
    const timeTd = document.createElement("td");
    if(editing){
      timeTd.contentEditable = "true";
      timeTd.innerText = r[1] || "";
      timeTd.addEventListener("input", e=>{rows[i][1]=e.target.innerText; save();});
    }else{
      timeTd.textContent = r[1] || "";
      if(String(r[3]||"").includes("已預約")){
        const reserved=document.createElement("span");
        reserved.className="reserved-time-badge";
        reserved.textContent="已預訂";
        timeTd.appendChild(reserved);
      }
    }
    tr.appendChild(timeTd);

    // Itinerary clickable in view mode
    const itTd = document.createElement("td");
    if(!editing && r[4]){
      const a=document.createElement("a");
      a.className="it-link"; a.href=safeMapUrl(r[4]); a.target="_blank"; a.rel="noopener noreferrer";
      a.innerHTML=itineraryHTML(r[2]);
      itTd.appendChild(a);
    } else {
      itTd.innerHTML = editing ? esc(r[2]).replace(/\n/g,"<br>") : itineraryHTML(r[2]);
      itTd.contentEditable = editing ? "true" : "false";
      itTd.addEventListener("input", e=>{rows[i][2]=e.target.innerText; save();});
    }

    tr.appendChild(itTd);

    // Notes, shortened in view mode
    const noteTd = document.createElement("td");
    if(editing){
      noteTd.innerHTML = esc(r[3]).replace(/\n/g,"<br>");
      noteTd.contentEditable = "true";
      noteTd.addEventListener("input", e=>{rows[i][3]=e.target.innerText; save();});
    }else{
      noteTd.className="short-address";
      noteTd.innerHTML = renderNoteHTML(r[2], r[3]);
    }
    tr.appendChild(noteTd);

    // Settings only in edit mode
    const setTd = document.createElement("td");
    if(editing){
      const inp = document.createElement("input");
      inp.className = "edit-input"; inp.value = r[4] || ""; inp.placeholder = "Google Maps 網址";
      inp.type="url"; inp.setAttribute("aria-label", "Google Maps 網址");
      inp.addEventListener("input", e=>{rows[i][4]=e.target.value.trim(); save();});
      setTd.appendChild(inp);

      const dur = document.createElement("input");
      dur.className = "edit-input"; dur.style.marginTop="6px";
      dur.type="number"; dur.min="0"; dur.step="5"; dur.value=r[5]||0;
      dur.placeholder="停留分鐘";
      dur.setAttribute("aria-label", "停留分鐘");
      dur.addEventListener("input", e=>{rows[i][5]=Number(e.target.value||0); save();});
      setTd.appendChild(dur);

      const lock = document.createElement("label");
      lock.className="small"; lock.style.display="block"; lock.style.marginTop="5px";
      const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!r[6];
      cb.onchange=e=>{rows[i][6]=e.target.checked; save(); render();};
      lock.appendChild(cb); lock.append(" 固定時間");
      setTd.appendChild(lock);
      if(!anchor){
        const daySelect=document.createElement('select');
        daySelect.className='day-select';daySelect.style.marginTop='6px';daySelect.style.width='100%';
        daySelect.setAttribute('aria-label','行程日期');
        fillDaySelect(daySelect,dayKeyForIndex(i));
        daySelect.onchange=()=>moveRowToDay(i,daySelect.value);
        setTd.appendChild(daySelect);
      }
    } else {
      setTd.innerHTML = '<span class="small">—</span>';
    }
    tr.appendChild(setTd);

    const act=document.createElement("td");
    if(editing && !anchor){
      const del=document.createElement("button");
      del.className="delete-row-btn";
      del.textContent="✕";
      del.title="刪除此行";
      del.setAttribute("aria-label","刪除此行");
      del.onclick=()=>{if(confirm("確定刪除這一行嗎？")){rows.splice(i,1); save(); render();}};
      act.appendChild(del);
    }
    tr.appendChild(act);

    tbody.appendChild(tr);
  });
}
function safeMapUrl(value){
  try {
    const url = new URL(value);
    return url.protocol === "https:" || url.protocol === "http:" ? url.href : "#";
  } catch(error){ return "#"; }
}
function itineraryHTML(value){
  const text=String(value||"");
  const split=text.search(/\d{1,2}:\d{2}起飛/);
  if(split>0 && text[split-1]==="｜"){
    return `${esc(text.slice(0,split-1))}<span class="mobile-line-separator">｜</span><span class="flight-details">${esc(text.slice(split))}</span>`;
  }
  return esc(text).replace(/\n/g,"<br>");
}
function moveRow(from, to){
  if(!editing||!rows[from]||isDayAnchor(from)||!canMoveTo(to)||from===to) return;
  const insertion=isDayAnchor(to)?to+1:from<to?to+1:to;
  const destination=insertion-(from<insertion?1:0);
  const moved = rows.splice(from, 1)[0];
  rows.splice(destination, 0, moved);
  save(); render();
  tbody.querySelector(`tr[data-index="${destination}"] .drag`)?.focus({preventScroll:true});
}
function dayEnd(key){
  const days=daySections();const index=days.findIndex(day=>day.key===key);
  return index<0?null:days[index+1]?.index??rows.length;
}
function moveRowToDay(from,key){
  if(!editing||!rows[from]||isDayAnchor(from)||dayKeyForIndex(from)===key) return;
  const end=dayEnd(key);if(end===null) return;
  const moved=rows.splice(from,1)[0];
  rows.splice(end-(from<end?1:0),0,moved);
  save();render();
}
editBtn.onclick=async()=>{
  editing=!editing;
  editBtn.textContent=editing?"✅ 完成編輯":"✏️ 開始編輯";
  statusEl.textContent=editing?"編輯模式｜可改文字、網址、停留時間":"瀏覽模式";
  if(!editing) save();
  render();
  if(!editing){
    editBtn.disabled=true;
    try{
      if(window.tripCloud) await window.tripCloud.publish({interactive:true});
      else statusEl.textContent="同步服務尚未就緒｜草稿已保留，請稍後再按完成編輯";
    }finally{
      if(syncMeta.dirty){editing=true;editBtn.textContent="✅ 完成編輯";render();}
      editBtn.disabled=false;
    }
  }
};
document.getElementById("recalcBtn").onclick=recalcTimes;
document.getElementById("addBtn").onclick=()=>{
  const end=dayEnd(document.getElementById('addDay').value);if(end===null) return;
  rows.splice(end,0,["","","新行程","","",30,false]);
  editing=true; editBtn.textContent="✅ 完成編輯"; save(); render();
};
render();
</script>
